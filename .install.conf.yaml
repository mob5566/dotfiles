- defaults:
    link:
      create: true
      relink: true

- clean: ['~', '~/.config']

- link:
    ~/.agignore:
    ~/.bash:
    ~/.bash_profile:
    ~/.bashrc:
    ~/.dotfiles: ''
    ~/.gitconfig:
    ~/.gitignore_global:
    ~/.hgrc:
    ~/.inputrc:
    ~/.pythonrc:
    ~/.shell:
    ~/.tmux:
    ~/.tmux.conf:
    ~/.vim:
    ~/.vimrc:
    ~/.zsh:
    ~/.zshrc:
    ~/.template:
    ~/.pylintrc:
    ~/.tig:
    ~/.tigrc:
    ~/.gdbinit: gdb-dashboard/.gdbinit
    ~/.gdbinit.d:
    ~/.config/bat/config: bat_config
    ~/.ripgreprc:
    ~/.zsh-complete: zsh/zsh-complete
    ~/.config/nnn/plugins/diffs_: config/nnn/plugins/diffs_
    ~/.config/nnn/plugins/autojump:
      path: config/nnn/plugins/autojump
      force: true
    ~/.config/nnn/plugins/show-md5: config/nnn/plugins/show-md5
    ~/.config/nnn/plugins/ag:
      path: config/nnn/plugins/ag
      force: true
    ~/.config/nnn/plugins/finder:
      path: config/nnn/plugins/finder
      force: true
    ~/.config/nnn/plugins/fzcd:
      path: config/nnn/plugins/fzcd
      force: true
    ~/.config/nnn/plugins/fzopen:
      path: config/nnn/plugins/fzopen
      force: true
    ~/.config/nnn/plugins/gitroot:
      path: config/nnn/plugins/gitroot
      force: true
    ~/.config/nnn/plugins/imgview:
      path: config/nnn/plugins/imgview
      force: true
    ~/.config/nnn/plugins/preview-tabbed:
      path: config/nnn/plugins/preview-tabbed
      force: true
    ~/.config/nnn/plugins/preview-tui:
      path: config/nnn/plugins/preview-tui
      force: true
    ~/.ycm_global_extra_conf.py: ycm_global_extra_conf.py
    ~/.gemini/GEMINI.md: gemini/GEMINI.md
    ~/.gemini/settings.json: gemini/settings.json
    ~/.gemini/commands: gemini/commands
    ~/.gemini/jetski/skills: agents/skills

- shell:
  - git config --global url.https://github.com/.insteadOf git://github.com/
  - git update-submodules # after linking ~/.gitconfig
  -
    command:  (cd vim/bundle/YouCompleteMe/ && python install.py --all)
    description: Install YouCompleteMe
    quite: true
    stdout: true

  # install autojump
  -
    command:  (cd shell/plugins/autojump/ && ./install.py)
    description: Install Autojump
    quite: true
    stdout: true

  # generate tmuxline configure
  - vim -c 'Tmuxline airline' -c 'TmuxlineSnapshot! ~/.tmuxline.conf' -c 'quit'
  # generate promptline configure
  - vim -c 'PromptlineSnapshot! ~/.shell_prompt.sh airline' -c 'quit'

